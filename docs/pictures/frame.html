<!doctype html>
<!--
  The devices around the README picture. scripts/picture.py captures ipad.png and phone.png from
  a running lectern, puts them beside this file and photographs it at 2x into lectern.png.
  The background stays transparent so the picture sits on GitHub's light and dark pages alike.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>lectern</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { width: 1040px; height: 1040px; position: relative; }
  .device {
    position: absolute;
    background: #1d1d1f;
    box-shadow: inset 0 0 0 2px #48484a, 0 24px 48px rgba(0, 0, 0, .28);
  }
  .device img { display: block; }
  .ipad { left: 24px; top: 20px; padding: 24px; border-radius: 48px; }
  .ipad img { width: 640px; height: 921px; border-radius: 22px; }
  .phone { left: 676px; top: 300px; padding: 13px; border-radius: 52px; }
  .phone img { width: 314px; height: 680px; border-radius: 40px; }
</style>
</head>
<body>
  <div class="device ipad"><img src="ipad.png" alt=""></div>
  <div class="device phone"><img src="phone.png" alt=""></div>
</body>
</html>
